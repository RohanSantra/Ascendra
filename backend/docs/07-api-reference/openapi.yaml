    post:
      operationId: post_api_v1_announcements
      summary: Creates an organisation announcement draft.
      description: 'Access: Organisation Admin. Source: src/modules/announcements/announcement.routes.js.'
      tags:
      - Dashboards and engagement
      parameters:
      - name: X-Organization-Id
        in: header
        required: true
        schema:
          type: string
        description: Organization selected for organization-scoped authorization.
      security:
      - BearerAuth: []
      responses:
        2XX:
          description: Successful response; see the module controller for the exact status code and response data.
        default:
          description: Standard Ascendra error response; see docs/07-api-reference/error-codes.md.
    get:
      operationId: get_api_v1_announcements
