openapi: 3.1.0
info:
  title: Ascendra Backend API
  version: 1.0.0
  description: Route inventory derived from the checked-in Express route registry. Request and response schemas
    are intentionally not guessed where the implementation contract requires controller and validation inspection.
servers:
- url: http://localhost:5000
  description: Local development server; the API version prefix is included in each path and defaults to v1.
tags:
- name: Health
- name: Authentication
- name: Organizations and memberships
- name: Trainers and competencies
- name: Matching and assignments
- name: Courses and learning
- name: Dashboards and engagement
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Default cookie name; configurable with JWT_REFRESH_COOKIE_NAME.
paths:
